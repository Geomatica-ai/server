
networks:
  merginmaps:
    name: mergin

services:
  db:
    image: postgres:14
    container_name: merginmaps-db
    restart: unless-stopped
    networks:
      - merginmaps
    environment:
      - POSTGRES_DB=mergin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ./mergin_db:/var/lib/postgresql/data

  redis:
    image: redis:6.2.17
    container_name: merginmaps-redis
    restart: unless-stopped
    networks:
      - merginmaps
    command: redis-server --save 60 1 --loglevel warning

  server:
    image: merginmaps-backend:custom
    container_name: merginmaps-server
    restart: unless-stopped
    user: 901:999
    volumes:
      - ./projects:/data
      - ./diagnostic_logs:/diagnostic_logs
    env_file:
      - .prod.env
    environment:
      - WEBHOOK_PUSH_URL=${WEBHOOK_PUSH_URL:-}
    depends_on:
      - db
      - redis
    command: ["gunicorn --config config.py application:application"]
    networks:
      - merginmaps

  celery-beat:
    image: merginmaps-backend:custom
    container_name: celery-beat
    restart: unless-stopped
    env_file:
      - .prod.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - WEBHOOK_PUSH_URL=${WEBHOOK_PUSH_URL:-}
    depends_on:
      - redis
      - server
    command: ["celery -A application.celery beat --loglevel=info"]
    networks:
      - merginmaps

  celery-worker:
    image: merginmaps-backend:custom
    container_name: celery-worker
    restart: unless-stopped
    user: 901:999
    env_file:
      - .prod.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - WEBHOOK_PUSH_URL=${WEBHOOK_PUSH_URL:-}
    volumes:
      - ./projects:/data
    depends_on:
      - redis
      - server
      - celery-beat
    command: ["celery -A application.celery worker --loglevel=info"]
    networks:
      - merginmaps

  web:
    image: lutraconsulting/merginmaps-frontend:2025.7.3
    container_name: merginmaps-web
    restart: unless-stopped
    user: 101:999
    networks:
      - merginmaps

  proxy:
    image: nginxinc/nginx-unprivileged:1.27
    container_name: merginmaps-proxy
    restart: unless-stopped
    user: 101:999
    ports:
      - "8080:8080"
      - "8082:8082"
    volumes:
      - ./projects:/data
      - ../common/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - web
    networks:
      - merginmaps

secrets:
  db_password:
    file: .db_secret
